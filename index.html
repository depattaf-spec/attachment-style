<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attachment Style Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom right, #312e81, #581c87, #9d174d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: white;
        }

        .container {
            max-width: 672px;
            width: 100%;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.5s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .welcome-screen {
            text-align: center;
        }

        .title-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .title-glow {
            position: absolute;
            inset: 0;
            filter: blur(60px);
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            opacity: 0.3;
            border-radius: 50%;
        }

        h1 {
            position: relative;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .gradient-text {
            display: block;
            background: linear-gradient(to right, #f9a8d4, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.25rem;
            color: white;
            line-height: 1.75;
            margin: 0 auto 2rem;
            max-width: 28rem;
            padding: 0 1rem;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 28rem;
            margin: 0 auto 2rem;
        }

        .info-box p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .progress-bars {
            display: flex;
            gap: 0.25rem;
            flex: 1;
            margin-right: 1rem;
        }

        .progress-bar {
            height: 8px;
            flex: 1;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.5s ease;
        }

        .progress-bar.completed {
            background: linear-gradient(to right, #f9a8d4, #c4b5fd);
        }

        .progress-bar.current {
            background: rgba(255, 255, 255, 0.5);
        }

        .progress-text {
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .question-header {
            margin-bottom: 1.5rem;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.75rem;
            line-height: 1.5;
            color: rgb(255, 255, 255);
        }

        .question-hint {
            font-size: 0.875rem;
            color: rgb(224, 224, 224);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option {
            cursor: pointer;
            width: 100%;
            text-align: left;
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            color: rgb(255, 255, 255);
            font-size: 1.125rem;
            line-height: 1.6;
            font-weight: 500;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .option.selected {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .btn-next {
            width: 100%;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgb(255, 255, 255);
        }

        .btn-next:disabled {
            background: rgba(255, 255, 255, 0.1);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next:not(:disabled) {
            background: linear-gradient(to right, #ec4899, #8b5cf6);
        }

        .btn-next:not(:disabled):hover {
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .results-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .results-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .results-subtitle {
            font-size: 1.125rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 40rem;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        .result-card h3 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }

        .percentage-item {
            margin-bottom: 1.5rem;
        }

        .percentage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .percentage-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .icon-badge {
            padding: 0.5rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-badge svg {
            width: 24px;
            height: 24px;
        }

        .percentage-bar-bg {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            height: 12px;
            overflow: hidden;
        }

        .percentage-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 1s ease;
        }

        .primary-style-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .primary-icon {
            padding: 1rem;
            border-radius: 9999px;
        }

        .primary-icon svg {
            width: 48px;
            height: 48px;
        }

        .traits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .trait-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.875rem;
        }

        .section {
            margin-bottom: 1.5rem;
        }

        .section h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .section p {
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .question-text {
                font-size: 1.25rem;
            }

            .results-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="welcomeScreen" class="screen active">
            <div class="welcome-screen">
                <div class="title-container">
                    <div class="title-glow"></div>
                    <h1>
                        Discover Your
                        <span class="gradient-text">Attachment Style</span>
                    </h1>
                </div>
                
                <p class="subtitle">
                    A comprehensive 25-question assessment based on attachment theory research
                </p>
                
                <div class="info-box">
                    <p>
                        Most people have a mix of attachment patterns. This assessment will show you your complete profile across all four styles, not just one label.
                    </p>
                </div>
                
                <button class="btn-primary" id="startBtn">
                    <span>Begin Assessment</span>
                </button>
            </div>
        </div>

        <div id="quizScreen" class="screen">
            <div class="progress-container">
                <div class="progress-bars" id="progressBars"></div>
                <span class="progress-text" id="progressText">1/25</span>
            </div>

            <div class="question-card">
                <div class="question-header">
                    <h2 class="question-text" id="questionText"></h2>
                    <p class="question-hint">Select all that apply</p>
                </div>
                
                <div class="options-container" id="optionsContainer"></div>

                <button class="btn-next" id="nextBtn" disabled>
                    Next
                </button>
            </div>
        </div>

        <div id="resultsScreen" class="screen"></div>
    </div>

    <script>

                ]
            }
        ];

        const attachmentStyles = {
            secure: {
                title: "Secure Attachment",
                color: "linear-gradient(to bottom right, #34d399, #14b8a6)",
                description: "You have a healthy, balanced approach to relationships with comfort in both intimacy and independence.",
                traits: ["Emotionally available", "Good boundaries", "Comfortable with intimacy", "Effective communicator", "Trusts easily", "Self-aware"],
                strengths: "Your secure attachment allows you to form deep, meaningful connections while maintaining your sense of self. You navigate conflicts constructively and trust comes naturally.",
                growth: "Continue nurturing your relationships with open communication. Your stability can help partners with insecure attachment patterns feel safer.",
                percentage: "50-60% of adults"
            },
            anxious: {
                title: "Anxious-Preoccupied",
                color: "linear-gradient(to bottom right, #fbbf24, #f97316)",
                description: "You deeply value close relationships and may sometimes worry about your partner's feelings or availability.",
                traits: ["Highly empathetic", "Values closeness", "Intuitive", "Passionate", "Loyal", "Emotionally expressive"],
                strengths: "Your capacity for deep emotional connection and attunement to others' feelings is a gift. You invest fully in relationships and aren't afraid to show you care.",
                growth: "Practice self-soothing and building self-worth independent of relationships. Mindfulness and therapy can help manage relationship anxiety while preserving your wonderful sensitivity.",
                percentage: "20% of adults"
            },
            avoidant: {
                title: "Dismissive-Avoidant",
                color: "linear-gradient(to bottom right, #60a5fa, #818cf8)",
                description: "You value independence and self-reliance, preferring to maintain some emotional distance even in close relationships.",
                traits: ["Self-reliant", "Independent", "Strong boundaries", "Logical", "Self-sufficient", "Resilient"],
                strengths: "Your independence and self-sufficiency are valuable traits. You maintain your identity in relationships and don't lose yourself in others.",
                growth: "Challenge yourself to practice vulnerability in small doses with trusted people. Recognizing that needing others isn't weakness can deepen your connections without threatening your autonomy.",
                percentage: "25% of adults"
            },
            fearful: {
                title: "Fearful-Avoidant",
                color: "linear-gradient(to bottom right, #a78bfa, #ec4899)",
                description: "You experience both a desire for intimacy and fear of it, creating an internal push-pull dynamic in relationships.",
                traits: ["Deeply introspective", "Highly perceptive", "Complex", "Resilient", "Self-aware", "Empathetic"],
                strengths: "Your awareness of the complexity of relationships gives you deep insight into human connection. You see multiple perspectives and understand nuance.",
                growth: "Therapy, especially focusing on trauma or early attachment wounds, can be transformative. Practice self-compassion and gradual vulnerability with safe people. Your healing journey can lead to profound growth.",
                percentage: "5-10% of adults"
            }
        };

        let currentQuestion = 0;
        let selectedOptions = [];
        let answers = [];

        const icons = {
            secure: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>',
            anxious: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
            avoidant: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
            fearful: '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>'
        };

        const smallIcons = {
            secure: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>',
            anxious: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
            avoidant: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
            fearful: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>'
        };

        function startQuiz() {
            document.getElementById('welcomeScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionText').textContent = question.text;
            document.getElementById('progressText').textContent = `${currentQuestion + 1}/${questions.length}`;
            
            const progressBars = document.getElementById('progressBars');
            progressBars.innerHTML = '';
            questions.forEach((_, index) => {
                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                if (index < currentQuestion) bar.classList.add('completed');
                if (index === currentQuestion) bar.classList.add('current');
                progressBars.appendChild(bar);
            });

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.textContent = option.text;
                optionDiv.setAttribute('data-index', index);
                optionDiv.onclick = function() { toggleOption(index); };
                optionsContainer.appendChild(optionDiv);
            });

            selectedOptions = [];
            updateNextButton();
        }

        function toggleOption(index) {
            const optionElements = document.querySelectorAll('.option');
            
            if (selectedOptions.includes(index)) {
                selectedOptions = selectedOptions.filter(i => i !== index);
                optionElements[index].classList.remove('selected');
            } else {
                selectedOptions.push(index);
                optionElements[index].classList.add('selected');
            }
            
            updateNextButton();
        }

        function updateNextButton() {
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = selectedOptions.length === 0;
            
            if (currentQuestion === questions.length - 1) {
                nextBtn.textContent = 'See Results';
            } else {
                nextBtn.textContent = 'Next';
            }
        }

        function handleNext() {
            if (selectedOptions.length === 0) return;

            const selectedAnswers = selectedOptions.map(i => questions[currentQuestion].options[i]);
            answers.push(selectedAnswers);

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            const scores = { secure: 0, anxious: 0, avoidant: 0, fearful: 0 };
            let totalPoints = 0;

            answers.forEach(answerSet => {
                answerSet.forEach(answer => {
                    Object.keys(scores).forEach(style => {
                        scores[style] += answer.score[style];
                        totalPoints += answer.score[style];
                    });
                });
            });

            const percentages = {};
            Object.keys(scores).forEach(style => {
                percentages[style] = totalPoints > 0 ? Math.round((scores[style] / totalPoints) * 100) : 0;
            });

            const sortedStyles = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
            const primary = sortedStyles[0];
            const secondary = percentages[sortedStyles[1]] >= 20 ? sortedStyles[1] : null;

            renderResults(percentages, primary, secondary);

            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultsScreen').classList.add('active');
        }

        function renderResults(percentages, primary, secondary) {
            const resultsScreen = document.getElementById('resultsScreen');
            
            let html = `
                <div class="results-header">
                    <h2 class="results-title">Your Attachment Profile</h2>
                    <p class="results-subtitle">Most people have mixed patterns. Here's your complete breakdown:</p>
                </div>

                <div class="result-card">
                    <h3>Your Attachment Breakdown</h3>
                    <div>
            `;

            Object.keys(percentages).sort((a, b) => percentages[b] - percentages[a]).forEach(style => {
                html += `<div class="percentage-item">
                    <div class="percentage-header">
                        <div class="percentage-label">
                            <div class="icon-badge" style="background: ${attachmentStyles[style].color}">
                                ${smallIcons[style]}
                            </div>
                            <span style="font-weight: 600">${attachmentStyles[style].title}</span>
                        </div>
                        <span style="font-weight: bold; font-size: 1.25rem">${percentages[style]}%</span>
                    </div>
                    <div class="percentage-bar-bg">
                        <div class="percentage-bar-fill" style="background: ${attachmentStyles[style].color}; width: ${percentages[style]}%"></div>
                    </div>
                </div>`;
            });

            html += `
                    </div>
                </div>

                <div class="result-card">
                    <div class="primary-style-header">
                        <div class="primary-icon" style="background: ${attachmentStyles[primary].color}">
                            ${icons[primary]}
                        </div>
                        <div>
                            <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.875rem">Primary Style</p>
                            <h3 style="font-size: 1.875rem; font-weight: bold; margin: 0">${attachmentStyles[primary].title}</h3>
                            <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.875rem; margin-top: 0.25rem">${attachmentStyles[primary].percentage}</p>
                        </div>
                    </div>

                    <p style="line-height: 1.75; margin-bottom: 1.5rem; color: rgba(255, 255, 255, 0.9)">
                        ${attachmentStyles[primary].description}
                    </p>

                    <div class="section">
                        <h4>Your Strengths</h4>
                        <div class="traits-grid">
                            ${attachmentStyles[primary].traits.map(trait => `<div class="trait-item">${trait}</div>`).join('')}
                        </div>
                    </div>

                    <div class="section">
                        <h4>What This Means</h4>
                        <p>${attachmentStyles[primary].strengths}</p>
                    </div>

                    <div class="section">
                        <h4>Growth Opportunities</h4>
                        <p>${attachmentStyles[primary].growth}</p>
                    </div>
                </div>
            `;

            if (secondary) {
                html += `
                    <div class="result-card">
                        <div class="primary-style-header">
                            <div class="primary-icon" style="background: ${attachmentStyles[secondary].color}">
                                ${icons[secondary]}
                            </div>
                            <div>
                                <p style="color: rgba(255, 255, 255, 0.7); font-size: 0.875rem">Secondary Tendency</p>
                                <h3 style="font-size: 1.5rem; font-weight: bold; margin: 0">${attachmentStyles[secondary].title}</h3>
                            </div>
                        </div>

                        <p style="line-height: 1.75; margin-bottom: 1rem; color: rgba(255, 255, 255, 0.9)">
                            You also show tendencies toward ${attachmentStyles[secondary].title.toLowerCase()}. ${attachmentStyles[secondary].description}
                        </p>

                        <p style="line-height: 1.75; color: rgba(255, 255, 255, 0.8)">
                            ${attachmentStyles[secondary].growth}
                        </p>
                    </div>
                `;
            }

            html += `
                <div class="result-card">
                    <h3>Understanding Your Profile</h3>
                    <div style="line-height: 1.75; color: rgba(255, 255, 255, 0.9)">
                        <p style="margin-bottom: 0.75rem">
                            <strong style="color: white">It's normal to have mixed patterns.</strong> Attachment styles aren't fixed categories—they're patterns that can vary by relationship, context, and personal growth.
                        </p>
                        <p style="margin-bottom: 0.75rem">
                            <strong style="color: white">Your style can change.</strong> With self-awareness, therapy, and secure relationships, people can develop more secure attachment patterns over time.
                        </p>
                        <p style="margin-bottom: 0.75rem">
                            <strong style="color: white">Different relationships, different patterns.</strong> You might be secure with friends but anxious in romantic relationships, or vice versa.
                        </p>
                        <p>
                            <strong style="color: white">This is a starting point.</strong> Use these insights for self-reflection and growth, not as limiting labels. Consider discussing your results with a therapist for deeper exploration.
                        </p>
                    </div>
                </div>

                <div style="text-align: center">
                    <button class="btn-primary" id="restartBtn">
                        <span>Take Assessment Again</span>
                    </button>
                </div>
            `;

            resultsScreen.innerHTML = html;
            document.getElementById('restartBtn').addEventListener('click', restartQuiz);
        }

        function restartQuiz() {
            currentQuestion = 0;
            selectedOptions = [];
            answers = [];
            
            document.getElementById('resultsScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.add('active');
        }

        document.getElementById('startBtn').addEventListener('click', startQuiz);
        document.getElementById('nextBtn').addEventListener('click', handleNext);
    </script>
</body>
</html>
